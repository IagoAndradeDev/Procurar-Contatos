<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Procurar Contatos</title>
</head>
<body>

        <div class="textos">
            <h1>Pesquisar Usuario</h1>

        </div>

            <label>Usuario</label>
            <input type="text">
        </div>

        <div class="resultado" style="display: none;">
            <div class="texto">
                <h2></h2>
                <div class="usuario">
                    <p></p>
                </div>
            </div>
        </div>
    </main>
<script src="script.js"></script>

</html>
